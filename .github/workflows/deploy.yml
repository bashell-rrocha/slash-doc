# Publica o site de documentação no Cloudflare Pages (projeto slash-docs)
# quando a main recebe uma versão (git flow: release/x.y.z -> main).
# Também pode ser disparado manualmente pela aba Actions.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=slash-docs --branch=main
